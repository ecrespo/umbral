# Architecture boundaries for Umbral (Constitution Art. 3, Tech Design §5.2).
# CI runs `task arch`; a new layer violation or import cycle breaks the build.
#
# The rules, restated from Tech Design §5.2:
#   */domain        -> the standard library and other */domain
#   */ports         -> its own domain and other */domain
#   */adapters      -> its own ports, its own domain and external libraries
#   agents          -> ports of sessions, tools, context, llmgw, security, store
#   llmgw, sessions -> never agents
#   cmd/*           -> everything
#
# Domain packages are listed explicitly instead of through commonComponents so that
# this file reads as the whole rule, with no implicit permissions.
version: 3
workdir: .

# e2e/us003/fixture is a module of its own, not Umbral's code: the Go repository with a broken
# test that the live US-003 run copies and asks the agent to fix (T-F1-21). It imports nothing
# of Umbral's and nothing of Umbral's imports it, so no component applies to it. docs/spikes/acp
# is the same: the throwaway ACP client of spike T-F2-00, a module of its own.
exclude:
  - e2e/us003/fixture
  - docs/spikes/acp

components:
  # --- composition root -------------------------------------------------------
  cmd: { in: cmd/** }

  # --- embedded assets --------------------------------------------------------
  # shell holds the integration bootstrap scripts and the embed directive that reaches
  # them. It is a leaf: no package dependencies, so no module can hide logic in it.
  shellscripts: { in: shell }

  # --- operator tools ------------------------------------------------------------
  # tools/rulesign signs rule bundles offline. It may reach the security domain only, so its
  # `verify` is the daemon's own verification function and nothing else (T-F1-30).
  rulesign-tool: { in: tools/rulesign }

  # --- module application cores ------------------------------------------------
  # The service that orchestrates a module's own ports. Tech Design §5.1 lists domain,
  # ports and adapters; the orchestrator that uses them has to live somewhere, and putting
  # it in the module root keeps it out of both domain, which must stay pure, and adapters,
  # which must stay replaceable.
  sessions-service: { in: internal/sessions }

  # The workspace tree's own core, the same shape and the same reason as
  # sessions-service: the orchestrator has to live outside domain, which must stay pure,
  # and outside adapters, which must stay replaceable.
  workspaces-service: { in: internal/workspaces }

  # The model gateway's core — the catalog, and from T-F1-07 the router — for the same
  # reason: it orchestrates llmgw's ports and belongs in neither domain nor adapters.
  llmgw-service: { in: internal/llmgw }

  # The agent runtime (T-F1-13), for the same reason: it orchestrates the module's ports and
  # the other modules' ports (Tech Design §5.2: agents -> ports of sessions, tools, context,
  # llmgw, security, store), and belongs in neither domain nor adapters.
  agents-service: { in: internal/agents }

  # The MCP client (T-F1-17), for the same reason: the manager orchestrates the module's own
  # ports — the store, the SDK connector, the secrets, and the sink its tools go to.
  mcp-service: { in: internal/mcp }

  waits-service: { in: internal/waits }

  # The integration surface (T-F1-25): external state reports and `pane.state_changed`.
  integrations-service: { in: internal/integrations }

  # The notification sink (T-F1-27): normalization, rate limit, typed reasons.
  notify-service: { in: internal/notify }

  # The worktree engine (T-F2-02): it orders the git operations and owns the rows' states over
  # its own two ports, a store and a git.
  worktrees-service: { in: internal/worktrees }

  # policy.explain (T-F1-28): it gathers a thread's mode, write root and rules through a
  # port of its own and asks the pure engine, so it belongs in neither domain nor adapters.
  security-service: { in: internal/security }

  # The tree's integration tests wire the real store to the service, which is the job
  # Art. 3 reserves for a composition root — the same exception sessions-integration has.
  workspaces-integration: { in: internal/workspaces/integration }

  # The module's integration tests wire the real adapters together, which is the job Art. 3
  # reserves for a composition root. Naming it here keeps every file under the rules rather
  # than excluding _test.go from them.
  sessions-integration: { in: internal/sessions/integration }

  # The same exception for the integration surface, whose tests run over the real tree.
  integrations-integration: { in: internal/integrations/integration }

  # The worktree engine's tests drive a real git through the real adapter (T-F2-02).
  worktrees-integration: { in: internal/worktrees/integration }

  # --- cross-cutting modules (no hexagonal split) -----------------------------
  bus:    { in: internal/bus }
  api:    { in: internal/api }
  store:  { in: internal/store }
  config: { in: internal/config }
  # The daemon's counters (T-F1-15); modules count through a port of their own and
  # cmd/umbrald hands them this implementation, so nothing imports obs but the root.
  obs:    { in: internal/obs }
  client: { in: internal/client }
  tui:          { in: internal/tui }
  tui-ports:    { in: internal/tui/ports }
  tui-adapters: { in: internal/tui/adapters/** }

  # --- hexagonal modules ------------------------------------------------------
  sessions-domain:   { in: internal/sessions/domain }
  sessions-ports:    { in: internal/sessions/ports }
  sessions-adapters: { in: internal/sessions/adapters/** }

  workspaces-domain:   { in: internal/workspaces/domain }
  workspaces-ports:    { in: internal/workspaces/ports }
  workspaces-adapters: { in: internal/workspaces/adapters/** }

  agents-domain:   { in: internal/agents/domain }
  agents-ports:    { in: internal/agents/ports }
  agents-adapters: { in: internal/agents/adapters/** }

  tools-domain:   { in: internal/tools/domain }
  tools-ports:    { in: internal/tools/ports }
  tools-adapters: { in: internal/tools/adapters/** }

  context-domain:   { in: internal/context/domain }
  context-ports:    { in: internal/context/ports }
  context-adapters: { in: internal/context/adapters/** }

  llmgw-domain:   { in: internal/llmgw/domain }
  llmgw-ports:    { in: internal/llmgw/ports }
  llmgw-adapters: { in: internal/llmgw/adapters/** }

  security-domain:   { in: internal/security/domain }
  security-ports:    { in: internal/security/ports }
  security-adapters: { in: internal/security/adapters/** }

  mcp-domain:   { in: internal/mcp/domain }
  mcp-ports:    { in: internal/mcp/ports }
  mcp-adapters: { in: internal/mcp/adapters/** }

  waits-domain: { in: internal/waits/domain }
  worktrees-domain:   { in: internal/worktrees/domain }
  worktrees-ports:    { in: internal/worktrees/ports }
  worktrees-adapters: { in: internal/worktrees/adapters/** }
  waits-ports:  { in: internal/waits/ports }

  integrations-domain:   { in: internal/integrations/domain }
  integrations-ports:    { in: internal/integrations/ports }
  integrations-adapters: { in: internal/integrations/adapters/** }
  notify-domain:         { in: internal/notify/domain }
  notify-ports:          { in: internal/notify/ports }
deps:
  # --- domain: the standard library and other domains, nothing else -----------
  sessions-domain:
    anyVendorDeps: false
    mayDependOn:
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  agents-domain:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  tools-domain:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain
      - agents-domain
      - context-domain
      - llmgw-domain
      - security-domain
  context-domain:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain
      - agents-domain
      - tools-domain
      - llmgw-domain
      - security-domain
  llmgw-domain:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - security-domain
  security-domain:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain

  # The MCP domain imports nothing but the standard library. The allowance is unused: go-arch-lint
  # requires one, and another domain is the narrowest, as workspaces-domain's is.
  mcp-domain:
    anyVendorDeps: false
    mayDependOn:
      - llmgw-domain

  # --- ports: domain types only; no infrastructure, no external libraries -----
  sessions-ports:
    anyVendorDeps: false
    mayDependOn:
      - bus
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  agents-ports:
    anyVendorDeps: false
    mayDependOn:
      - bus
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  tools-ports:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  context-ports:
    anyVendorDeps: false
    mayDependOn:
      # skill.changed is a bus event the API forwards (T-F1-34), as security-ports'
      # events are.
      - bus
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  llmgw-ports:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  security-ports:
    anyVendorDeps: false
    mayDependOn:
      - bus
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain

  mcp-ports:
    anyVendorDeps: false
    mayDependOn:
      - bus
      - mcp-domain
      - llmgw-domain

  # --- adapters: its own ports, infrastructure and external libraries ---------
  # sessions and llmgw never reach the agent runtime (Tech Design §5.2).
  shellscripts:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain

  sessions-adapters:
    anyVendorDeps: true
    mayDependOn:
      - sessions-ports
      - store
      - bus
      - shellscripts
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  llmgw-adapters:
    anyVendorDeps: true
    mayDependOn:
      # adapters/fantasyconv is what the adapters built on Fantasy share (T-F1-05).
      - llmgw-adapters
      - llmgw-ports
      - store
      - bus
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  tools-adapters:
    anyVendorDeps: true
    mayDependOn:
      # mcptools offers an MCP server's tools in the mcp module's own types (T-F1-17).
      - mcp-domain
      # the registry's tests assemble the built-ins (T-F1-09).
      - tools-adapters
      - tools-ports
      - sessions-ports
      - security-ports
      - bus
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  context-adapters:
    anyVendorDeps: true
    mayDependOn:
      - context-ports
      - store
      - bus
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  security-adapters:
    anyVendorDeps: true
    mayDependOn:
      - security-ports
      - store
      - bus
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain

  # The store over `mcp_servers`, and the SDK connector with its test server (T-F1-17).
  mcp-adapters:
    anyVendorDeps: true
    mayDependOn:
      - mcp-adapters
      - mcp-ports
      - mcp-domain
      - store
      - llmgw-domain

  # agents is the only module allowed to reach the other modules' ports.
  agents-adapters:
    anyVendorDeps: true
    mayDependOn:
      - agents-ports
      - sessions-ports
      - tools-ports
      - context-ports
      - llmgw-ports
      - security-ports
      - store
      - bus
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain

  # --- cross-cutting ----------------------------------------------------------
  bus:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  config:
    anyVendorDeps: true
    mayDependOn:
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  store:
    anyVendorDeps: true
    mayDependOn:
      - bus
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  # Tech Design §5.2: bus, store, config, and the ports AND domain of the modules it
  # serves. The pair is not separable — a port's signatures are written in domain types —
  # but the grant is per module: this list held every *-domain in the tree until 2026-09-20,
  # which would have let api reach into a module it does not serve with nothing to notice.
  # A task that wires a new module into api adds its two rows here, deliberately.
  api:
    anyVendorDeps: true
    mayDependOn:
      - bus
      - store
      - config
      - sessions-ports
      - sessions-domain
      - agents-ports
      - agents-domain
      - security-domain
      - workspaces-ports
      - workspaces-domain
      - mcp-ports
      - mcp-domain
      - waits-ports
      - waits-domain
      - integrations-ports
      - integrations-domain
      # policy.explain (T-F1-28).
      - security-ports
      - notify-ports
      - notify-domain
      # skill.* (T-F1-34).
      - context-ports
      - context-domain
      # worktree.* (T-F2-03): the engine's inbound port, its rows, diffs and refusals.
      - worktrees-ports
      - worktrees-domain
  client:
    anyVendorDeps: true
    mayDependOn:
      - config
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
  tui-ports:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain
  tui-adapters:
    anyVendorDeps: true
    mayDependOn:
      - tui-ports
      - client
      - sessions-domain
  tui:
    anyVendorDeps: true
    mayDependOn:
      - client
      - tui-ports
      - sessions-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain

  agents-service:
    anyVendorDeps: true
    mayDependOn:
      - agents-ports
      - agents-domain
      - tools-ports
      - tools-domain
      - context-ports
      - context-domain
      - llmgw-domain
      - security-domain
      - bus

  mcp-service:
    anyVendorDeps: false
    mayDependOn:
      - mcp-ports
      - mcp-domain
      - bus

  sessions-service:
    anyVendorDeps: true
    mayDependOn:
      - sessions-ports
      - sessions-domain
      - store
      - bus

  sessions-integration:
    anyVendorDeps: true
    mayDependOn:
      - sessions-service
      - sessions-ports
      - sessions-domain
      - sessions-adapters
      - store
      - bus

  # OpenTelemetry since T-F1-18, and no other module: the modules trace and count through
  # ports of their own, which cmd/umbrald gives obs's implementation. The `bus` allowance is
  # unused, as workspaces-domain's is: go-arch-lint requires one, and `bus` is the narrowest
  # a sink can be given — the one Tech Design §5.2 gives `notify`.
  obs:
    anyVendorDeps: true
    mayDependOn:
      - bus

  # --- composition root: the only place that wires modules together (Art. 3) ---
  cmd:
    anyVendorDeps: true
    mayDependOn:
      - api
      - bus
      - obs
      - store
      - config
      - client
      - tui
      - tui-ports
      - tui-adapters
      - sessions-service
      - workspaces-service
      - llmgw-service
      - agents-service
      - mcp-service
      - waits-service
      - integrations-service
      - notify-service
      - security-service
      - shellscripts
      - sessions-ports
      - sessions-adapters
      - workspaces-ports
      - workspaces-adapters
      - agents-ports
      - agents-adapters
      - mcp-ports
      - mcp-adapters
      - waits-ports
      - integrations-ports
      - integrations-adapters
      - notify-ports
      - notify-domain
      - tools-ports
      - tools-adapters
      - context-ports
      - context-adapters
      - llmgw-ports
      - llmgw-adapters
      - security-ports
      - security-adapters
      - sessions-domain
      - workspaces-domain
      - agents-domain
      - tools-domain
      - context-domain
      - llmgw-domain
      - security-domain
      - mcp-domain
      # Agent detection: the built-in manifests overlaid with the local ones (T-F2-10).
      - integrations-domain
      # The worktree engine and its adapters, wired to the runtime and worktree.* (T-F2-03).
      - worktrees-service
      - worktrees-ports
      - worktrees-adapters
      - worktrees-domain


  # --- the workspace tree (Tech Design §5.2) ----------------------------------
  # `workspaces` -> ports of `sessions` and `store`; never `agents`, `api` or `waits`.
  # The sessions-ports allowance is what lets a pane own a terminal without the tree
  # knowing what a PTY is; the absence of sessions-adapters is what stops it reaching for
  # one directly, and the absence of api is what keeps the wire format out of the model.
  # The standard domain rule and nothing more. The allowance is unused today — identifiers,
  # states and a rollup are arithmetic over strings — but go-arch-lint requires every
  # component to name at least one permission, so it names the one the rule already grants
  # rather than a wider one. `shellscripts` carries the same allowance for the same reason.
  workspaces-domain:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain

  workspaces-ports:
    anyVendorDeps: false
    mayDependOn:
      - workspaces-domain
      - sessions-domain
      # The published events carry a bus.Kind, the same reason sessions-ports depends on it.
      - bus

  workspaces-adapters:
    anyVendorDeps: true
    mayDependOn:
      - workspaces-ports
      - workspaces-domain
      - sessions-domain
      - store

  workspaces-service:
    anyVendorDeps: true
    mayDependOn:
      - workspaces-ports
      - workspaces-domain
      - sessions-domain
      - bus

  llmgw-service:
    anyVendorDeps: false
    mayDependOn:
      - llmgw-ports
      - llmgw-domain

  workspaces-integration:
    anyVendorDeps: true
    mayDependOn:
      - workspaces-service
      - workspaces-ports
      - workspaces-domain
      - workspaces-adapters
      - sessions-domain
      - store
      - bus

  # --- the wait engine (Tech Design §5.2, DD-011) -----------------------------
  # `waits` -> ports of `agents` and `sessions`, plus `bus`; never `api`. It reads a
  # thread's status and a pane's screen through its own ports, which `cmd` implements over
  # the runtime and the terminal, and follows both through their published events. It has
  # no adapters and no store of its own: a wait lives only as long as its call. The domain
  # reuses the sessions domain's escape-sequence stripper, so a pane's output is read the
  # way a block's is.
  waits-domain:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain

  waits-ports:
    anyVendorDeps: false
    mayDependOn:
      - waits-domain
      - sessions-domain

  waits-service:
    anyVendorDeps: false
    mayDependOn:
      - waits-ports
      - waits-domain
      - agents-ports
      - agents-domain
      - sessions-ports
      - sessions-domain
      - bus

  # --- the worktree engine (Tech Design §5.2, T-F2-02) -------------------------
  # `worktrees` -> its own ports and domain; its adapters reach the git binary and `store`.
  # It imports no other module: a thread reaches its worktree through the agents runtime, which
  # `cmd` wires (T-F2-03). The domain's allowance is unused, as workspaces-domain's is.
  worktrees-domain:
    anyVendorDeps: false
    mayDependOn:
      - sessions-domain

  worktrees-ports:
    anyVendorDeps: false
    mayDependOn:
      - worktrees-domain

  worktrees-adapters:
    anyVendorDeps: false
    mayDependOn:
      - worktrees-ports
      - worktrees-domain
      - store

  worktrees-service:
    anyVendorDeps: false
    mayDependOn:
      - worktrees-ports
      - worktrees-domain

  worktrees-integration:
    anyVendorDeps: false
    mayDependOn:
      - worktrees-service
      - worktrees-ports
      - worktrees-domain
      - worktrees-adapters

  # --- the integration surface (Tech Design §5.2, T-F1-25) --------------------
  # `integrations` -> ports of `workspaces` and `store`, plus `bus`; never `agents` or `api`.
  # It reads a pane's effective state through the tree, which resolves DD-012's precedence,
  # and learns of the changes its own reports did not make through events `cmd` subscribes
  # it to. The domain uses its allowance for the display metadata keys (T-F1-26), which the
  # tree reads back and so are declared once, in workspaces-domain.
  integrations-domain:
    anyVendorDeps: false
    mayDependOn:
      - workspaces-domain

  integrations-ports:
    anyVendorDeps: false
    mayDependOn:
      - integrations-domain
      - workspaces-domain
      # The published event carries a bus.Kind, as workspaces-ports' do.
      - bus

  integrations-adapters:
    anyVendorDeps: true
    mayDependOn:
      - integrations-ports
      - integrations-domain
      - store

  integrations-service:
    anyVendorDeps: false
    mayDependOn:
      - integrations-ports
      - integrations-domain
      - workspaces-ports
      - workspaces-domain
      - bus

  integrations-integration:
    anyVendorDeps: true
    mayDependOn:
      - integrations-service
      - integrations-ports
      - integrations-domain
      - integrations-adapters
      - workspaces-service
      - workspaces-ports
      - workspaces-domain
      - workspaces-adapters
      - sessions-domain
      - store
      - bus

  # --- the notification sink (Tech Design §5.2, T-F1-27) ------------------------
  # `notify` -> `bus` and the standard library only; it is a sink and imports no other module.
  # Its deliverer is the API server and its callers reach it through cmd, so nothing here
  # names another module. The `bus` allowance is unused, as obs's is.
  notify-domain:
    anyVendorDeps: false
    mayDependOn:
      - bus

  notify-ports:
    anyVendorDeps: false
    mayDependOn:
      - notify-domain

  notify-service:
    anyVendorDeps: false
    mayDependOn:
      - notify-ports
      - notify-domain
      - bus
  security-service:
    anyVendorDeps: false
    mayDependOn:
      - security-ports
      - security-domain
      - llmgw-domain
  rulesign-tool:
    anyVendorDeps: false
    mayDependOn:
      - security-domain
