# Release: what a `v*` tag builds, checks, signs and leaves as a DRAFT GitHub release.
#
# Proposed by delta `2026-11-signed-releases` and NOT RUN YET: no tag has been pushed since it
# was written. The first run is the test; the release it leaves is a draft, so nothing is
# published until the Tech Lead looks at it and presses the button.
#
# What a tag gets:
#   - the .deb and the Linux and macOS tar.gz, built and checked exactly as the CI workflow's
#     `deb` and `archives` jobs build and check them;
#   - SHA256SUMS over every package;
#   - a CycloneDX SBOM of the Go module graph the binaries were built from;
#   - a Sigstore build-provenance attestation for every package and an SBOM attestation,
#     kept by GitHub and checked with
#       gh attestation verify <file> --repo ecrespo/umbral
#     No signing key exists to keep or to lose: the signature is bound to this workflow's
#     identity at this tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GO_VERSION: '1.27'
  CYCLONEDX_GOMOD_VERSION: v1.12.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the version comes from git describe
      - name: The tag is on develop or main, not on a stray commit
        run: |
          git fetch -q origin develop main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop &&
             ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release: $GITHUB_REF_NAME points at $GITHUB_SHA, which is on neither develop nor main" >&2
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Zig, which builds libghostty-vt
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build libghostty-vt (cgo dependency of the sessions emulator)
        run: ./scripts/build_libghostty.sh
      - run: echo "PKG_CONFIG_PATH=$HOME/.local/ghostty-vt/share/pkgconfig" >> "$GITHUB_ENV"
      - name: Build the binaries
        run: |
          version="$(git describe --tags --always)"
          for bin in umbrald umb umbral-tui; do
            go build -trimpath -ldflags "-s -w -X main.version=$version" -o "bin/$bin" "./cmd/$bin"
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The tar.gz archive, checked
        run: |
          packaging/tar/build.sh bin "$VERSION" dist
          packaging/tar/check.sh dist/umbral-*.tar.gz
      - name: The .deb, checked and installed in a clean container
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
          packaging/deb/build.sh bin "$VERSION" dist
          packaging/deb/check.sh dist/umbral_*.deb
          packaging/deb/smoke.sh dist/umbral_*.deb
      - name: The SBOM of the module graph the binaries were built from
        if: runner.os == 'Linux'
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@"$CYCLONEDX_GOMOD_VERSION"
          cyclonedx-gomod mod -licenses -json -output "dist/umbral-${VERSION#v}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Checksums, attestations and the draft release
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # the workflow's identity, which Sigstore signs for
      attestations: write # store the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true
      - name: SHA256SUMS over every package
        working-directory: dist
        run: |
          ls -l
          sha256sum umbral_*.deb umbral-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance for every package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/umbral_*.deb
            dist/umbral-*.tar.gz
      - name: Find the SBOM
        run: echo "SBOM=$(ls dist/umbral-*.cdx.json)" >> "$GITHUB_ENV"
      - name: The SBOM, attested against every package
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/umbral_*.deb
            dist/umbral-*.tar.gz
          sbom-path: ${{ env.SBOM }}
      - name: The draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Umbral ${GITHUB_REF_NAME#v}" \
            --notes "Verify a download: \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`." \
            dist/umbral_*.deb dist/umbral-*.tar.gz dist/SHA256SUMS dist/umbral-*.cdx.json
