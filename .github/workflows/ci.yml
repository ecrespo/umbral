# CI gate for Umbral (Constitution Art. 1, Art. 2, Art. 3 and Art. 9).
# A red job blocks the merge. Nothing here may be skipped with a flag.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    name: Specs (Art. 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: REQ coverage, matrices and DDL executability
        run: python3 tools/sdd_check.py
      - name: Mermaid diagrams
        run: |
          npm install --prefix tools
          node tools/mermaid_check.mjs

  icons:
    name: Branding kit (REQ-PKG-001, 002, 003, 006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install the kit's render dependencies and the .desktop validator
        run: |
          python3 -m pip install --quiet cairosvg Pillow
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Checksums, reproducible regeneration and .desktop validation
        run: ./scripts/icons_check.sh

  lint:
    name: Lint (Art. 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the history
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build libghostty-vt (cgo dependency of the sessions emulator)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: ./scripts/build_libghostty.sh
      - run: echo "PKG_CONFIG_PATH=$HOME/.local/ghostty-vt/share/pkgconfig" >> "$GITHUB_ENV"
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofumpt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (with gosec)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  arch:
    name: Architecture boundaries (Art. 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go install github.com/fe3dback/go-arch-lint@latest
      - name: Check the Tech Design §5.2 rules
        run: go-arch-lint check
      - name: Prove the rules actually reject a violation
        run: ./scripts/arch_selftest.sh

  test:
    name: Tests with the race detector (Art. 2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build libghostty-vt (cgo dependency of the sessions emulator)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: ./scripts/build_libghostty.sh
      - run: echo "PKG_CONFIG_PATH=$HOME/.local/ghostty-vt/share/pkgconfig" >> "$GITHUB_ENV"
      - name: Install the shells the block tests need (T-F0-08)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: go test -race ./...
      - name: Build every binary
        run: go build ./...
