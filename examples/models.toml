# Umbral — example models.toml
#
# Copy it to $XDG_CONFIG_HOME/umbral/models.toml (usually ~/.config/umbral/models.toml) and
# keep the providers you use. The daemon reads it at start and again on `config.reload`
# (API Spec §5.28); `umb` has no command for that yet, so restart `umbrald` after a change.
#
# The file names providers, model classes and the routing policy, and never a key: a
# credential is a reference, `keyring:<service>/<account>` in the OS keyring (REQ-SEC-004).
# Store one with, for example:
#
#   secret-tool store --label "umbral huggingface" service umbral username huggingface  # Linux
#   security add-generic-password -s umbral -a huggingface -w                          # macOS
#
# A key written here in the clear refuses its entry, and only that entry.

[router]
policy = "local-first"          # local-first | cost | quality
offline = false                 # true: only providers with a loopback base_url (see OmniRoute below)
max_cost_usd_per_thread = 1.5   # a thread stops (stop_reason = budget) once it has spent this; omit for no cap

# Task classes: candidates in order, each `<provider id>/<model>`. The router takes the first
# that is up and can do what the call needs, and falls back on a retryable failure (429, 5xx,
# a transport error, an empty stream) or a slow first token.
# The model names are examples: use what your providers list (API `model.list`).
[classes]
fast = ["ollama/qwen2.5-coder:1.5b", "hf/Qwen/Qwen2.5-Coder-7B-Instruct"]
code = ["ollama/gpt-oss:20b", "hf/openai/gpt-oss-120b:cerebras"]
plan = ["ollama/qwen3:8b", "openrouter/moonshotai/kimi-k2"]
embed = ["ollama/nomic-embed-text"]

# --- Local ------------------------------------------------------------------------------

[[providers]]
id = "ollama"
type = "ollama"                 # the native adapter: sends num_ctx on every request
base_url = "http://127.0.0.1:11434"
[providers.options]
num_ctx = 32768                 # without it: 32768, capped at the model's own window
keep_alive = "10m"

# [[providers]]
