# --- Preset: Hugging Face router (REQ-LLM-007) --------------------------------------------
# One OpenAI-compatible endpoint in front of many inference providers. A `:<provider>` suffix
# on the model pins the backend (`:cerebras`, `:together`, `:fireworks-ai`…); without one the
# router picks. Needs a Hugging Face access token allowed to call Inference Providers.

[[providers]]
id = "hf"
type = "openai-compat"
base_url = "https://router.huggingface.co/v1"
api_key = "keyring:umbral/huggingface"

# --- Preset: OmniRoute, self-hosted (REQ-LLM-007) ------------------------------------------
# An OpenAI-compatible gateway you run yourself, with intent aliases (such as `auto/…`) and
# its own quota fallback, which Umbral does not duplicate (DD-004). Set base_url to where your
# instance listens (the port below is only an example) and add its models to a class, e.g.
# `code = ["ollama/gpt-oss:20b", "omniroute/<model or alias>"]`.
#
# Beware: Umbral judges locality by base_url alone. On loopback OmniRoute counts as local, so
# offline = true does not stop it, and what it forwards to cloud providers is not in Umbral's
# egress_log (the request stops at 127.0.0.1). That is why it is in no class above: keep it
# out of your classes whenever a call must stay on the machine.

[[providers]]
id = "omniroute"
type = "openai-compat"
base_url = "http://127.0.0.1:20128/v1"
# api_key = "keyring:umbral/omniroute"   # if your instance requires one

# --- Remote meta-provider -----------------------------------------------------------------

[[providers]]
id = "openrouter"
type = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key = "keyring:umbral/openrouter"
